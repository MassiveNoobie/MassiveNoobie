<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title description">
  <title id="title">Same CSV. Different winner.</title>
  <desc id="description">CSV load timing on one Apple M5 Max, using one million synthetic rows in the November 9, 2026 session. Zig had the faster first load in 23 of 30 paired blocks, and n0is C++ in 7. For warmed loads, Zig had 0 faster loads, and n0is C++ had 30. Source: n0.is/research/zig-first-and-warmed-csv.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#10202B"/>
      <stop offset="0.55" stop-color="#081018"/>
      <stop offset="1" stop-color="#0B1820"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#90B1B7" stroke-opacity=".10"/>
    </pattern>
  </defs>

  <rect x=".5" y=".5" width="959" height="419" rx="19" fill="url(#background)" stroke="#2A404C"/>
  <rect x=".5" y=".5" width="959" height="419" rx="19" fill="url(#grid)"/>
  <path d="M38 1H179" stroke="#55F5CE" stroke-width="2" stroke-linecap="round"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="40" y="45" fill="#55F5CE" font-weight="700" letter-spacing="1.8">&gt;_ N0IS RESEARCH</text>
    <text x="920" y="45" fill="#AAC0C7" text-anchor="end" letter-spacing="1.6">CSV LOAD TIMING</text>
    <text x="42" y="135" fill="#B6CAD0">1M synthetic rows · one Apple M5 Max · Nov 9, 2026</text>
  </g>
  <text x="38" y="104" fill="#EDF4F4" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="57" font-weight="750" letter-spacing="-2.5">Same CSV. Different winner.</text>

  <rect x="40.5" y="164.5" width="431" height="175" rx="11" fill="#0F1B25" stroke="#2A404C"/>
  <rect x="488.5" y="164.5" width="431" height="175" rx="11" fill="#0F1B25" stroke="#2A404C"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.4">
    <text x="61" y="195" fill="#A0B7BF"><tspan fill="#FFBC73">01</tspan><tspan> / FIRST LOAD</tspan></text>
    <text x="509" y="195" fill="#A0B7BF"><tspan fill="#55F5CE">02</tspan><tspan> / WARMED LOAD</tspan></text>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="720">
    <text x="58" y="254" fill="#FFBC73" font-size="52" letter-spacing="-1.7">23</text>
    <text x="129" y="252" fill="#FFBC73" font-size="22">Zig</text>
    <text x="285" y="252" fill="#55F5CE" font-size="22">7 n0is C++</text>
    <text x="506" y="254" fill="#55F5CE" font-size="52" letter-spacing="-1.7">30</text>
    <text x="577" y="252" fill="#55F5CE" font-size="22">n0is C++</text>
    <text x="834" y="252" fill="#FFBC73" font-size="22">0 Zig</text>
  </g>
  <g fill="none" stroke-width="20" stroke-dasharray="9 4" aria-hidden="true">
    <path d="M61 280h299" stroke="#FFBC73"/>
    <path d="M360 280h91" stroke="#55F5CE"/>
    <path d="M509 280h390" stroke="#55F5CE"/>
  </g>
  <g fill="#B6CAD0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">
    <text x="61" y="319">First timed load in a fresh process</text>
    <text x="509" y="319">Measured after three in-process warmups</text>
  </g>

  <path d="M40 362H920" stroke="#2A404C"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="40" y="388" fill="#B6CAD0">FASTER LOADS / 30 PAIRED BLOCKS PER CONDITION</text>
    <text x="920" y="388" fill="#55F5CE" text-anchor="end">n0.is/research/zig-first-and-warmed-csv</text>
  </g>
</svg>
